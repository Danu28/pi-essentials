name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run size --if-present
      - name: size gate (dist <160KB)
        shell: bash
        run: |
          node -e "const fs=require('fs');let t=0;for(const f of fs.readdirSync('dist')){try{t+=fs.statSync('dist/'+f).size}catch{}};const kb=Math.round(t/1024);console.log('dist size '+kb+'KB');if(kb>160){console.error('SIZE GATE FAIL: dist '+kb+'KB >160KB');process.exit(1)}"
  ts-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install typescript@next --no-save
      - run: npm run typecheck
